services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askdb-backend
    ports:
      - "8000:8000"
    environment:
      # LLM Configuration
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      - LLM_MODEL=${LLM_MODEL:-local-model}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0}
      # Database Configuration
      - DATABASE_URL=${DATABASE_URL}
      # Agent Configuration
      - MAX_RETRY_ATTEMPTS=${MAX_RETRY_ATTEMPTS:-3}
      - QUERY_TIMEOUT_SECONDS=${QUERY_TIMEOUT_SECONDS:-30}
      # SQL Query Configuration
      - DEFAULT_RESULT_LIMIT=${DEFAULT_RESULT_LIMIT:-10}
      - MAX_RESULT_LIMIT=${MAX_RESULT_LIMIT:-50}
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      # Seq Logging Configuration
      - SEQ_SERVER_URL=http://seq:5341
      - SEQ_API_KEY=${SEQ_API_KEY:-}
      # Langfuse Observability Configuration
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-http://langfuse:3000}
      # Redis Configuration (reuses langfuse-redis, DB 1 for isolation)
      - REDIS_URL=redis://:langfuseredis@langfuse-redis:6379/1
    depends_on:
      - seq
      - langfuse
      - langfuse-redis
    networks:
      - askdb-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: askdb-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - askdb-network
    restart: unless-stopped

  # Seq logging service
  seq:
    image: datalust/seq:latest
    container_name: askdb-seq
    ports:
      - "5341:5341"  # Ingestion API
      - "5342:80"    # Web UI
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - seq-data:/data
    networks:
      - askdb-network
    restart: unless-stopped

  # ── Langfuse Observability Stack ──────────────────────────────────
  # Based on https://github.com/langfuse/langfuse/blob/main/docker-compose.yml

  # Shared env vars for langfuse-web and langfuse-worker (YAML anchor)
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: askdb-langfuse-worker
    depends_on: &langfuse-deps
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: langfuseredis
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
    networks:
      - askdb-network
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:3
    container_name: askdb-langfuse
    depends_on: *langfuse-deps
    ports:
      - "3000:3000"   # Web UI + API
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      # Auto-initialize org, project and admin user for zero-config setup
      LANGFUSE_INIT_ORG_ID: askdb
      LANGFUSE_INIT_ORG_NAME: AskDB
      LANGFUSE_INIT_PROJECT_ID: askdb-agent
      LANGFUSE_INIT_PROJECT_NAME: AskDB Agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-askdb}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-askdb}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
      LANGFUSE_INIT_USER_NAME: Admin
    networks:
      - askdb-network
    restart: unless-stopped

  langfuse-postgres:
    image: postgres:16-alpine
    container_name: askdb-langfuse-postgres
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-pg-data:/var/lib/postgresql/data
    networks:
      - askdb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server
    container_name: askdb-langfuse-clickhouse
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse-ch-data:/var/lib/clickhouse
      - langfuse-ch-logs:/var/log/clickhouse-server
    networks:
      - askdb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-redis:
    image: redis:7-alpine
    container_name: askdb-langfuse-redis
    command: >
      --requirepass langfuseredis
      --maxmemory-policy noeviction
    networks:
      - askdb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "langfuseredis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: askdb-langfuse-minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - langfuse-minio-data:/data
    networks:
      - askdb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

networks:
  askdb-network:
    driver: bridge

volumes:
  seq-data:
  langfuse-pg-data:
  langfuse-ch-data:
  langfuse-ch-logs:
  langfuse-minio-data:
